apiVersion: apps/v1
kind: Deployment
metadata:
  name: findit
  annotations:
    gitops-demo: "automatic-sync-test"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: findit
  template:
    metadata:
      labels:
        app: findit
    spec:
      containers:
        - name: findit
          image: findit:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
